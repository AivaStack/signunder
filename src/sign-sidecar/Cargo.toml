[package]
name = "sign-sidecar"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = { version = "1.12.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "credentials-process"] }
aws-sdk-kms = { version = "1.123.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
base64 = "0.22.1"
# Pinned exactly: manifest construction must not drift under us (SIGNUNDER.md §4.10).
c2pa = "=0.91.2"
# The raw signer trait c2pa-rs uses for identity credentials; the version c2pa 0.91.2 locks.
c2pa_raw_crypto = "=0.1.2"
google-cloud-gax = "1.15.0"
# Without its default TLS provider (aws-lc): the sidecar installs ring for the process.
google-cloud-kms-v1 = { version = "1.15.0", default-features = false }
pem = "3.0.6"
prost = "0.14.4"
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "crypto", "ring", "x509-parser"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
# Already locked through rcgen; certificate validity dates.
time = "0.3.55"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
x509-parser = "0.18.1"
yasna = "0.6.0"

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
ring = "0.17"
tokio-stream = { version = "0.1.19", features = ["net"] }
