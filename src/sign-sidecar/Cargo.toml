[package]
name = "sign-sidecar"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = { version = "1.12.0", default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio", "credentials-process"] }
aws-sdk-kms = { version = "1.123.0", default-features = false, features = ["rustls", "rt-tokio"] }
base64 = "0.22.1"
# Pinned exactly: manifest construction must not drift under us (SIGNUNDER.md §4.10).
c2pa = "=0.91.2"
prost = "0.14.4"
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal"] }
tonic = "0.14.6"
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
x509-parser = "0.18.1"

[build-dependencies]
tonic-prost-build = "0.14.6"
