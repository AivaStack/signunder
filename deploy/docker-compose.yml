# Local development stack. Credentials here are for local use only.
name: signunder

services:
  api:
    build:
      context: ..
      dockerfile: src/Signunder.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Mutual TLS to the sidecar and worker with the public development certificates (ADR 0010).
      Sidecar__Address: https://sign-sidecar:50051
      Internal__Tls__CaPath: /internal-tls/ca.pem
      Internal__Tls__CertPath: /internal-tls/signunder-api.pem
      Internal__Tls__KeyPath: /internal-tls/signunder-api.key
      Watermark__Address: https://wm-worker:50052
      # Signed copies served by proxy mode. A local S3 stand-in; it keeps nothing on restart.
      Media__ServiceUrl: http://s3:9090
      Media__AccessKey: local
      Media__SecretKey: local
      Media__Bucket: signed-media
      PublicVerify__AllowedOrigins: http://localhost:3000
      # The development key, held by the local-kms emulator. NON-CONFORMANT (ADR 0003).
      Signer__KeyRef: arn:aws:kms:eu-central-1:111122223333:key/00000000-0000-4000-8000-00005160de01
      Signer__CertChainPath: /dev-signer/es256.chain.pem
      # Optional RFC 3161 timestamp authority; unset means no timestamp.
      Signer__TsaUrl: ${SIGNUNDER_TSA_URL:-}
      ConnectionStrings__Postgres: Host=postgres;Database=signunder;Username=signunder;Password=signunder
      ConnectionStrings__Redis: redis:6379
    volumes:
      - ../src/sign-sidecar/dev-signer/es256.chain.pem:/dev-signer/es256.chain.pem:ro
      - ../deploy/internal-tls/dev:/internal-tls:ro
    ports:
      - "8080:8080"
    # Start-up applies migrations, so "running" is not yet "listening".
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      sign-sidecar:
        condition: service_started
      wm-worker:
        condition: service_healthy
      s3:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sign-sidecar:
    build:
      context: ..
      dockerfile: src/sign-sidecar/Dockerfile
    environment:
      AWS_ENDPOINT_URL: http://local-kms:8080
      SIDECAR_TLS_CERT: /internal-tls/sign-sidecar.pem
      SIDECAR_TLS_KEY: /internal-tls/sign-sidecar.key
      SIDECAR_TLS_CLIENT_CA: /internal-tls/ca.pem
      AWS_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    volumes:
      - ../deploy/internal-tls/dev:/internal-tls:ro
    ports:
      - "50051:50051"
    depends_on:
      - local-kms

  wm-worker:
    build:
      context: ..
      dockerfile: src/wm-worker/Dockerfile
    environment:
      WM_TLS_CERT: /internal-tls/wm-worker.pem
      WM_TLS_KEY: /internal-tls/wm-worker.key
      WM_TLS_CLIENT_CA: /internal-tls/ca.pem
    volumes:
      - ../deploy/internal-tls/dev:/internal-tls:ro
    ports:
      - "50052:50052"
    # The model takes a few seconds to load before the port opens.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 50052), 2)"]
      interval: 2s
      timeout: 3s
      retries: 60

  # Stands in for Supabase Storage's S3 interface (ADR 0008).
  s3:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: signed-media
    ports:
      - "9090:9090"

  # Stands in for AWS KMS and holds the public, NON-CONFORMANT development key.
  local-kms:
    image: nsmithuk/local-kms:3
    environment:
      KMS_REGION: eu-central-1
    volumes:
      - ../src/sign-sidecar/dev-signer/local-kms-seed.yaml:/init/seed.yaml:ro
    ports:
      - "4599:8080"

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: signunder
      POSTGRES_PASSWORD: signunder
      POSTGRES_DB: signunder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signunder -d signunder"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
