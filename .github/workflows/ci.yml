name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test Signunder.sln

  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src/sign-sidecar/Cargo.toml --check
      - run: cargo test --locked --manifest-path src/sign-sidecar/Cargo.toml
      - run: make test-kms

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/wm-worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ./genproto.sh
      - run: uv run ruff check . ../../tests/robustness
      - run: uv run ruff format --check . ../../tests/robustness
      - run: uv run pytest -q
      - run: uv run pytest -q ../../tests/robustness
