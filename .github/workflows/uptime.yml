# Every six hours, a full round trip through staging: the website, then an image signed
# with the demo company's key, verified, and recognised on its public verify route.
# Better Stack pings signunder.com and the API's /healthz every few minutes; this checks
# that signing actually works end to end (KMS, sidecar, watermark worker, registry).
# A failure opens an issue labelled uptime, or comments on the open one.
# About 120 Actions minutes a month; each run signs one image on staging.
name: uptime

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  API: https://signunder-staging-api.fly.dev
  SITE: https://signunder.com
  TENANT: demo

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tests/robustness/images/earth.jpg
          sparse-checkout-cone-mode: false
      - name: Round trip
        id: check
        continue-on-error: true
        env:
          KEY: ${{ secrets.STAGING_API_KEY }}
        run: |
          set -u
          fail() { echo "- $1" >> report.md; failed=1; }
          failed=0
          echo "Uptime round trip failed, $(date -u '+%d %b %Y %H:%M UTC') ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)):" > report.md
          echo >> report.md

          for path in / /verify /dashboard; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$SITE$path")
            [ "$code" = 200 ] || fail "$SITE$path answered $code"
          done

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$API/healthz")
          [ "$code" = 200 ] || fail "$API/healthz answered $code"

          # Signing wakes the sidecar and the worker, which stop when idle: one retry.
          for attempt in 1 2; do
            code=$(curl -s -o signed.jpg -D headers.txt -w '%{http_code}' --max-time 120 \
              -H "Authorization: Bearer $KEY" \
              -F "file=@tests/robustness/images/earth.jpg;type=image/jpeg" "$API/v1/sign")
            [ "$code" = 200 ] && break
            sleep 20
          done
          if [ "$code" != 200 ]; then
            fail "POST /v1/sign answered $code: $(head -c 300 signed.jpg)"
          else
            record=$(grep -i '^signunder-record-id:' headers.txt | cut -d' ' -f2 | tr -d '\r')
            curl -s --max-time 60 -H "Authorization: Bearer $KEY" \
              -F "file=@signed.jpg;type=image/jpeg" "$API/v1/verify" > verify.json
            python3 - <<'EOF' || fail "POST /v1/verify: $(head -c 300 verify.json)"
          import json, sys
          v = json.load(open("verify.json"))
          sys.exit(0 if v.get("manifest_found") and v.get("validation_state") in ("valid", "trusted") and not v.get("altered") else 1)
          EOF
            curl -s --max-time 60 -F "file=@signed.jpg;type=image/jpeg" \
              "$API/public/v1/$TENANT/verify" > public.json
            python3 - <<'EOF' || fail "POST /public/v1/$TENANT/verify did not recognise record $record: $(head -c 300 public.json)"
          import json, sys
          sys.exit(0 if json.load(open("public.json")).get("ours") else 1)
          EOF
          fi

          cat report.md
          exit $failed
      - name: Open or update the uptime issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create uptime --color B60205 --description "The staging round trip failed" --force
          open=$(gh issue list --label uptime --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file report.md
          else
            gh issue create --title "Staging round trip failing" --label uptime --body-file report.md
          fi
          exit 1
