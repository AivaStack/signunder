syntax = "proto3";

package signunder.sign.v1;

option csharp_namespace = "Signunder.Sign.V1";

// Contract between the .NET control plane and the Rust sign sidecar (docs/ARCHITECTURE.md §1.3).
// Assets travel as unary bytes, so callers must raise the gRPC message size limit
// above the 4 MB default; video will need a streaming RPC.
service SignService {
  rpc Sign(SignRequest) returns (SignResponse);
  rpc Validate(ValidateRequest) returns (ValidateResponse);
}

// c2pa-rs's overall verdict on a manifest store. crJSON carries per-manifest results
// but no overall state, so it travels beside the report.
enum ValidationState {
  VALIDATION_STATE_UNSPECIFIED = 0;
  // Not well formed, or a cryptographic check failed (for example the hard binding).
  VALIDATION_STATE_INVALID = 1;
  // Well formed and cryptographically intact; the signer is not on the trust list.
  VALIDATION_STATE_VALID = 2;
  // Valid, and the signing certificate chains to the trust list.
  VALIDATION_STATE_TRUSTED = 3;
}

message SignerRef {
  // KMS key ARN, or "dev:local" for the non-conformant development signer.
  string key_ref = 1;
  // "es256" or "ps256".
  string algorithm = 2;
  // Signing certificate first. Required with a KMS key; empty for the development signer.
  string cert_chain_pem = 3;
  // RFC 3161 timestamp authority URL.
  string tsa_url = 4;
}

message SignRequest {
  bytes asset = 1;
  string mime_type = 2;
  // A c2pa-rs manifest definition. In a c2pa.soft-binding assertion, each block's value
  // is base64; the sidecar stores it as bytes.
  string manifest_definition_json = 3;
  SignerRef signer = 4;
  // Optional: a CAWG identity assertion (cawg.x509.cose) naming the company that
  // publishes the content, signed with this identity key and certificate. The claim
  // itself is still signed by `signer`.
  IdentityRef identity = 5;
}

message IdentityRef {
  // A KMS key reference, or "dev:local" to use the development signer's key.
  string key_ref = 1;
  // "es256".
  string algorithm = 2;
  // The identity certificate naming the company, first; then its issuers.
  string cert_chain_pem = 3;
  // CAWG named actor roles, for example "cawg.publisher".
  repeated string roles = 4;
}

message SignResponse {
  bytes signed_asset = 1;
  bytes manifest_store = 2;
  // crJSON, as produced by c2pa-rs after validating the signed asset.
  string validation_report_json = 3;
  ValidationState validation_state = 4;
}

message ValidateRequest {
  bytes asset = 1;
  string mime_type = 2;
}

message ValidateResponse {
  // crJSON.
  string validation_report_json = 1;
  ValidationState validation_state = 2;
}
